<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="SmartCalc - A modern, responsive web calculator by Anil Kumar Putta. Features keyboard support, dark theme, and smooth animations.">
    <meta name="author" content="Anil Kumar Putta">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful, modern calculator built with HTML, CSS, and vanilla JavaScript">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Theme Toggle & History Toggle -->
    <div class="controls">
        <button type="button" class="control-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
            🌙
        </button>
        <button type="button" class="control-btn" id="history-toggle" aria-label="Toggle history" title="Toggle Calculation History">
            📜
        </button>
        <button type="button" class="control-btn" id="sound-toggle" aria-label="Toggle sound" title="Toggle Sound Effects">
            🔊
        </button>
    </div>

    <!-- History Sidebar -->
    <div class="history-sidebar" id="history-sidebar">
        <div class="history-header">
            <h3>History</h3>
            <button type="button" class="clear-history-btn" id="clear-history" aria-label="Clear history">Clear All</button>
        </div>
        <div class="history-list" id="history-list">
            <p class="history-empty">No calculations yet</p>
        </div>
    </div>

    <div class="container">
        <div class="calculator">
            <!-- Mode Switcher -->
            <div class="mode-switcher">
                <button type="button" class="mode-btn active" data-mode="standard" aria-label="Standard Mode">Standard</button>
                <button type="button" class="mode-btn" data-mode="scientific" aria-label="Scientific Mode">Scientific</button>
                <button type="button" class="mode-btn" data-mode="programmer" aria-label="Programmer Mode">Programmer</button>
            </div>
            
            <!-- Programmer Mode Base Display -->
            <div class="base-display" id="base-display" style="display: none;">
                <div class="base-row">
                    <span class="base-label">HEX</span>
                    <span class="base-value" id="hex-value">0</span>
                </div>
                <div class="base-row">
                    <span class="base-label">DEC</span>
                    <span class="base-value" id="dec-value">0</span>
                </div>
                <div class="base-row">
                    <span class="base-label">OCT</span>
                    <span class="base-value" id="oct-value">0</span>
                </div>
                <div class="base-row">
                    <span class="base-label">BIN</span>
                    <span class="base-value" id="bin-value">0</span>
                </div>
            </div>
            
            <div class="display">
                <div class="mode-indicator" id="mode-indicator">Standard Mode</div>
                <div class="previous-operand" data-previous-operand></div>
                <div class="current-operand" data-current-operand>0</div>
                <button type="button" class="copy-btn" id="copy-result" aria-label="Copy result" title="Copy to Clipboard">
                    📋
                </button>
            </div>
            <div class="buttons" id="button-container">
                <!-- Buttons will be dynamically generated based on calculator mode -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
